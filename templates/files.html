<!DOCTYPE html>
<html>

<head>
    <title>📁 Uploaded Files</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            margin-bottom: 40px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        th {
            padding: 18px 24px;
            text-align: left;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
            font-size: 0.95rem;
        }

        tbody tr {
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        a {
            text-decoration: none;
            color: #667eea;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 4px 8px;
            border-radius: 6px;
        }

        a:hover {
            color: #764ba2;
            background: #eef2ff;
        }

        .actions-separator {
            color: #cbd5e1;
            margin: 0 8px;
        }

        .back-link {
            display: inline-block;
            margin-top: 32px;
            padding: 12px 24px;
            text-align: center;
            width: 100%;
            background: white;
            color: #667eea;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .back-link:hover {
            background: #f8fafc;
            color: #764ba2;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 30px;
            }

            table {
                font-size: 0.85rem;
            }

            th,
            td {
                padding: 14px 12px;
            }

            a {
                padding: 3px 6px;
                font-size: 0.9rem;
            }

            .actions-separator {
                margin: 0 4px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📂 Cloud Storage Dashboard</h1>
        <table>
            <thead>
                <tr>
                    <th>File Name</th>
                    <th>Size (KB)</th>
                    <th>Uploaded On</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for file in files %}
                <tr>
                    <td>{{ file.name }}</td>
                    <td>{{ file.size }}</td>
                    <td>{{ file.time }}</td>
                    <td>
                        <a href="/download/{{ file.name }}">⬇️ Download</a>
                        <span class="actions-separator">|</span>
                        <a href="/delete/{{ file.name }}" onclick="return confirm('Delete this file?')">🗑️ Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="/" class="back-link">⬅️ Back to Upload Page</a>
    </div>
</body>

</html>
